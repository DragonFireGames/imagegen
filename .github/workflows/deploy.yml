name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Stamp deployed app and offline app-shell versions
        run: |
          sed -i "s|^const APP_CACHE_NAME = .*;|const APP_CACHE_NAME = \"illustrious-app-shell-${GITHUB_SHA}\";|" service-worker.js
          sed -i "s|__APP_BUILD_ID__|${GITHUB_SHA}|g" illustrious-experiment/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
