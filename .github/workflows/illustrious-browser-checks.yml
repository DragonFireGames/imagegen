name: Verify Illustrious browser experiment

on:
  push:
    branches: [main]
    paths:
      - "illustrious-experiment/**"
      - "service-worker.js"
      - ".github/workflows/illustrious-browser-checks.yml"
  pull_request:
    paths:
      - "illustrious-experiment/**"
      - "service-worker.js"
      - ".github/workflows/illustrious-browser-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check every Illustrious JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find illustrious-experiment -type f -name '*.js' -print0)
          node --input-type=module --check < service-worker.js

      - name: Check persistent UNet output flag scope
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("illustrious-experiment/text-to-image.js", "utf8");
          const start = source.indexOf("async function runUnetStep(");
          const end = source.indexOf("\nasync function releaseSessions", start);
          if (start < 0 || end < 0) throw new Error("Could not locate runUnetStep.");
          const fn = source.slice(start, end);
          const declaration = fn.indexOf("const usePersistentOutputs =");
          const tryBlock = fn.indexOf("\n  try {");
          const finallyBlock = fn.indexOf("\n  } finally {");
          if (!(declaration >= 0 && declaration < tryBlock && finallyBlock > tryBlock)) {
            throw new Error("usePersistentOutputs must be declared outside try so finally can access it.");
          }
          if (!fn.slice(finallyBlock).includes("if (!usePersistentOutputs)")) {
            throw new Error("runUnetStep finally block must retain the persistent-output fallback cleanup.");
          }
          console.log("Persistent UNet output flag is in scope for try/finally.");
          NODE

      - name: Check multi-image GPU batch wiring
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("illustrious-experiment/text-to-image.js", "utf8");
          const html = readFileSync("illustrious-experiment/index.html", "utf8");
          const required = [
            ["total batch control", html.includes('id="generationBatch"') && html.includes('max="20"')],
            ["parallel GPU control", html.includes('id="generationParallel"') && html.includes('max="4"')],
            ["multi-image generator", source.includes("async function generateMany(")],
            ["batch uses multi-image execution", source.includes("await generateMany(imageOptions, infillData")],
            ["conditioning is tiled across images", source.includes("makeConditioningBatch(conditioning, imageCount, branchCount, conditioningIndex)")],
            ["each image has independent initial noise", source.includes("createNormalNoise(latentSize, imageOptionsList[image].seed)")],
            ["each image has independent step noise", source.includes("imageOptionsList[image].seed + step + 1")],
            ["GPU scheduler updates whole latent batch", source.includes("totalLatentSize = latentSize * imageCount") && source.includes("dispatchWorkgroups(Math.ceil(totalLatentSize / 2 / 256))")],
            ["CFG uses distinct conditional branch", source.includes("halfAt(params.count + first)")],
            ["requested seeds increment", source.includes("baseSeed + index + offset")],
            ["random seed per image", source.includes("randomSeed ? resolveGenerationSeed(-1) : baseSeed + index + offset")],
            ["results saved as each decodes", source.includes("appendGeneratedResult(blob, itemOptions, imageIndex, batchCount)")],
            ["settings persist parallelism", source.includes("parallelImages: Number(fields.parallel?.value || 1)")],
            ["settings v2/v3 compatibility", source.includes("settings.version !== 2 && settings.version !== 3 && settings.version !== GENERATION_SETTINGS_VERSION")]
          ];
          const failed = required.filter(([, passed]) => !passed).map(([name]) => name);
          if (failed.length) throw new Error("GPU batch regression checks failed: " + failed.join(", "));
          console.log("Multi-image GPU batch wiring passed: " + required.map(([name]) => name).join(", "));
          NODE


      - name: Check local model loading and offline cache contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("illustrious-experiment/text-to-image.js", "utf8");
          const cache = readFileSync("illustrious-experiment/model-cache.js", "utf8");
          const lora = readFileSync("illustrious-experiment/lora-patcher.js", "utf8");
          const html = readFileSync("illustrious-experiment/index.html", "utf8");
          const sw = readFileSync("service-worker.js", "utf8");
          const appSw = readFileSync("illustrious-experiment/service-worker.js", "utf8");
          const generateStart = source.indexOf("async function generateMany(");
          const prepareStart = source.indexOf("async function prepareInferenceEngine(");
          const externalStart = source.indexOf("async function externalData(");
          const generateBody = source.slice(generateStart, source.indexOf("\nasync function generate(", generateStart));
          const prepareBody = source.slice(prepareStart, source.indexOf("\nfunction buildInfillLatentMask", prepareStart));
          const externalBody = source.slice(externalStart, source.indexOf("\nasync function loadSession", externalStart));
          const checks = [
            ["ONNX graphs loaded from cached bytes", source.includes("fetchModelResource(MODEL_BASE + component.onnx") && source.includes("InferenceSession.create(graphData, sessionOptions)")],
            ["external weights passed as local Blobs", externalBody.includes("fetchModelResource(MODEL_BASE + path") && externalBody.includes("data: await response.blob()")],
            ["tokenizer resources use model cache", source.includes("const response = await fetchModelResource(url")],
            ["scheduler included in cache preparation", cache.includes("SCHEDULER_CACHE_PATH") && cache.includes("await cache.put(schedulerKey, response.clone())")],
            ["scheduler and VAE encoder included in bundles", cache.includes("generationPaths(manifest, true), SCHEDULER_CACHE_PATH")],
            ["generation avoids repeated full cache verification", !generateBody.includes("prepareModelCache(")],
            ["engine preparation avoids repeated full cache verification", !prepareBody.includes("prepareModelCache(")],
            ["fallback downloads are reported", cache.includes("reportCacheMiss") && source.includes("MODEL CACHE MISS")],
            ["LoRA unpatched shards use cached Blob data", lora.includes("data: await response.blob()") && !lora.includes("data: MODEL_BASE + shard")],
            ["JSPI runtime is locally imported", source.includes('import("../vendor/onnxruntime-web/ort.jspi.bundle.min.mjs")') && !source.includes("cdn.jsdelivr.net/npm/onnxruntime-web")],
            ["service worker has project-root scope for vendor interception", html.includes('new URL("../service-worker.js", location.href)') && html.includes('navigator.serviceWorker.register(rootWorkerUrl, { scope: "../" })')],
            ["old narrow-scope worker is explicitly retired", html.includes('registration.scope === appScope') && html.includes("await registration.unregister()")],
            ["service worker resolves experiment and vendor assets under their actual folders", sw.includes('new URL("./illustrious-experiment/", self.registration.scope)') && sw.includes('new URL("../vendor/", APP_SCOPE)')],
            ["service worker limits request interception", sw.includes("if (!inExperiment && !inVendor) return;")],
            ["service worker precaches ONNX WASM", sw.includes("ort-wasm-simd-threaded.jspi.wasm") && sw.includes("ort-wasm-simd-threaded.asyncify.wasm")],
            ["root service worker revalidates app source while preserving offline fallback", sw.includes('new Request(request, { cache: "no-cache" })') && sw.includes("isRefreshableAppSource(url)") && sw.includes('return /\\.(?:html|js|mjs|css)$/.test(url.pathname);') && sw.includes("if (cached) return cached;")],
            ["root app-shell cache is versioned to replace stale source entries", sw.includes('illustrious-app-shell-source-v2')],
            ["legacy narrow-scope worker also revalidates app source", appSw.includes('new Request(request, { cache: "no-cache" })') && appSw.includes("isRefreshableAppSource(url)") && appSw.includes('return /\\.(?:html|js|mjs|css)$/.test(url.pathname);')]
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([name]) => name);
          if (failed.length) throw new Error("Offline cache checks failed: " + failed.join(", "));
          console.log("Offline model cache contract passed: " + checks.map(([name]) => name).join("; "));
          NODE

      - name: Check opt-in WebGPU validation mode and profiling diagnostics
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("illustrious-experiment/text-to-image.js", "utf8");
          const readme = readFileSync("illustrious-experiment/README.md", "utf8");
          const normalizedReadme = readme.replace(/\s+/g, " ");
          const loadStart = source.indexOf("async function loadSession(");
          const loadEnd = source.indexOf("\nfunction canBatchEncoder", loadStart);
          const buildStart = source.indexOf("async function buildUnetSessions(");
          const buildEnd = source.indexOf("\nasync function ensureUnetSessions", buildStart);
          const load = source.slice(loadStart, loadEnd);
          const build = source.slice(buildStart, buildEnd);
          const checks = [
            ["WebGPU-only validation is passed through to ORT", load.includes("if (validationMode) webgpuProvider.validationMode = validationMode;")],
            ["wgpuOnly is the default validation mode", source.includes(': "wgpuOnly";') && source.includes('preferredUnetValidationMode || "wgpuOnly"')],
            ["validation override is limited to UNet A/B/C session construction", (build.match(/preferredLayout,\s*validationMode/g) || []).length === 3],
            ["mode is restricted to documented values", source.includes('["disabled", "wgpuOnly", "basic", "full"].includes(requestedUnetValidationMode)')],
            ["validation mode participates in resident-session cache identity", source.includes('"|validation:" + (validationMode || "wgpuOnly")')],
            ["basic and full validation remain explicit overrides", source.includes('["disabled", "wgpuOnly", "basic", "full"].includes(requestedUnetValidationMode)')],
            ["disabled validation is an explicit benchmark-only option", source.includes('preferredUnetValidationMode === "disabled"') && source.includes("skips ONNX-side validation; benchmark-only")],
            ["graph-capture dispatch reports successful activation, not just the request", source.includes("graphCaptureActive: false") && source.includes("sessions.graphCaptureActive = graphCaptureEnabled") && source.includes('(sessions.graphCaptureActive ? " · graph capture active" : " · standard dispatch")') && source.includes('sessions.graphCaptureActive ? "|graph-capture" : "|standard-dispatch"')],
            ["dynamic UNet graph axes are parsed from ONNX dim_param fields", source.includes("function readOnnxGraphPorts(") && source.includes("function resolveUnetFreeDimensions(")],
            ["graph capture pins exact dynamic axes through freeDimensionOverrides", source.includes("sessionOptions.freeDimensionOverrides = overrides") && source.includes("expectedUnetPortShapes(component, width, height, batchSize)")],
            ["all three UNet partitions provide shape maps", (source.match(/\{ width, height, batchSize \}/g) || []).length === 3],
            ["capture fallback reason is retained and shown on resident reuse", source.includes("graphCaptureFallbackReason: null") && source.includes("sessions.graphCaptureFallbackReason = graphCaptureFallbackReason") && source.includes("Previous graph-capture attempt failed")],
            ["stale standard-dispatch sessions cannot masquerade as a capture cache hit", source.includes("graphCaptureEnabled && residentUnetSessions.graphCaptureActive !== true") && source.includes("Discarding stale resident UNet cache entry")],
            ["warm-up logging reflects the sessions actually being initialized", source.includes("const captureRequested = Boolean(sessions?.graphCaptureRequested)")],
            ["final GPU queue completion/readback time is measured", source.includes("const readbackStarted = performance.now()") && source.includes('readbackSeconds.toFixed(2)') && source.includes("outstanding GPU queue completion and buffer mapping")],
            ["README documents disabled validation and final readback timing", normalizedReadme.includes("`?validation=disabled`") && normalizedReadme.includes("final GPU scheduler latent readback")],
            ["legacy GPU profiling switch no longer enables unsupported profiling API", !source.includes("ort.env.webgpu.profiling =") && source.includes("gpuProfilingRequested")],
            ["README describes profiling limitation", normalizedReadme.includes("does not currently expose per-operator GPU profile traces to JavaScript")],
            ["README documents wgpuOnly as the default", normalizedReadme.includes("sessions default to ONNX Runtime's `wgpuOnly`")],
          ];
          const failed = checks.filter(([, ok]) => !ok).map(([name]) => name);
          if (failed.length) throw new Error("Optimization-setting checks failed: " + failed.join(", "));
          console.log("Optimization-setting checks passed: " + checks.map(([name]) => name).join("; "));
          NODE

      - name: Test dynamic UNet graph-capture dimension overrides
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { runInNewContext } from "node:vm";

          const source = readFileSync("illustrious-experiment/text-to-image.js", "utf8");
          const start = source.indexOf("function readOnnxVarint(");
          const end = source.indexOf("\nasync function loadSession(", start);
          if (start < 0 || end < 0) throw new Error("Could not isolate ONNX dimension helpers.");
          const helpers = source.slice(start, end) +
            "\nglobalThis.graphCaptureTestApi = { expectedUnetPortShapes, resolveUnetFreeDimensions };";
          const sandbox = { TextDecoder };
          runInNewContext(helpers, sandbox);

          const encoder = new TextEncoder();
          const concat = (...items) => {
            const size = items.reduce((total, item) => total + item.length, 0);
            const result = new Uint8Array(size);
            let offset = 0;
            for (const item of items) {
              result.set(item, offset);
              offset += item.length;
            }
            return result;
          };
          const varint = value => {
            let number = BigInt(value);
            const bytes = [];
            while (number > 0x7fn) {
              bytes.push(Number(number & 0x7fn) | 0x80);
              number >>= 7n;
            }
            bytes.push(Number(number));
            return new Uint8Array(bytes);
          };
          const field = (number, wire, payload) => wire === 2
            ? concat(varint(number * 8 + 2), varint(payload.length), payload)
            : concat(varint(number * 8), payload instanceof Uint8Array ? payload : varint(payload));
          const symbolicDimension = name => field(2, 2, encoder.encode(name));
          const numericDimension = value => field(1, 0, varint(value));

          function valueInfo(name, shape) {
            const dimensions = shape.map((value, axis) => {
              if (axis === 0) return symbolicDimension("batch_dim");
              if (shape.length === 4 && axis === 2) return symbolicDimension("height_" + value);
              if (shape.length === 4 && axis === 3) return symbolicDimension("width_" + value);
              return numericDimension(value);
            });
            const shapeProto = concat(...dimensions.map(dimension => field(1, 2, dimension)));
            const tensorType = concat(field(1, 0, 1), field(2, 2, shapeProto));
            const typeProto = field(1, 2, tensorType);
            return concat(field(1, 2, encoder.encode(name)), field(2, 2, typeProto));
          }

          for (const component of ["unet_a", "unet_b", "unet_c"]) {
            const expected = sandbox.graphCaptureTestApi.expectedUnetPortShapes(component, 768, 1024, 2);
            const graph = concat(
              ...Object.entries(expected.inputs).map(([name, shape]) => field(11, 2, valueInfo(name, shape))),
              ...Object.entries(expected.outputs).map(([name, shape]) => field(12, 2, valueInfo(name, shape)))
            );
            const model = field(7, 2, graph);
            const buffer = model.buffer.slice(model.byteOffset, model.byteOffset + model.byteLength);
            const overrides = sandbox.graphCaptureTestApi.resolveUnetFreeDimensions(
              buffer, component, 768, 1024, 2
            );
            assert.equal(overrides.batch_dim, 2, component + " batch override");
            const shapes = [...Object.values(expected.inputs), ...Object.values(expected.outputs)];
            const heights = new Set(shapes.filter(shape => shape.length === 4).map(shape => shape[2]));
            const widths = new Set(shapes.filter(shape => shape.length === 4).map(shape => shape[3]));
            for (const value of heights) assert.equal(overrides["height_" + value], value, component + " height override " + value);
            for (const value of widths) assert.equal(overrides["width_" + value], value, component + " width override " + value);
          }
          console.log("ONNX dim_param parsing and fixed-shape overrides passed for UNET_A, UNET_B, and UNET_C.");
          NODE
