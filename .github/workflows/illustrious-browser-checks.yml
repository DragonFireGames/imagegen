name: Verify Illustrious browser experiment

on:
  push:
    branches: [main]
    paths:
      - "illustrious-experiment/**"
      - ".github/workflows/illustrious-browser-checks.yml"
  pull_request:
    paths:
      - "illustrious-experiment/**"
      - ".github/workflows/illustrious-browser-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check every Illustrious JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find illustrious-experiment -type f -name '*.js' -print0)

      - name: Check persistent UNet output flag scope
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("illustrious-experiment/text-to-image.js", "utf8");
          const start = source.indexOf("async function runUnetStep(");
          const end = source.indexOf("\nasync function releaseSessions", start);
          if (start < 0 || end < 0) throw new Error("Could not locate runUnetStep.");
          const fn = source.slice(start, end);
          const declaration = fn.indexOf("const usePersistentOutputs =");
          const tryBlock = fn.indexOf("\n  try {");
          const finallyBlock = fn.indexOf("\n  } finally {");
          if (!(declaration >= 0 && declaration < tryBlock && finallyBlock > tryBlock)) {
            throw new Error("usePersistentOutputs must be declared outside try so finally can access it.");
          }
          if (!fn.slice(finallyBlock).includes("if (!usePersistentOutputs)")) {
            throw new Error("runUnetStep finally block must retain the persistent-output fallback cleanup.");
          }
          console.log("Persistent UNet output flag is in scope for try/finally.");
          NODE

      - name: Check sequential batch generation wiring
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("illustrious-experiment/text-to-image.js", "utf8");
          const html = readFileSync("illustrious-experiment/index.html", "utf8");
          const required = [
            ["batch control", html.includes('id="generationBatch"') && html.includes('max="20"')],
            ["sequential loop", source.includes("for (let index = 0; index < batchCount; index++)")],
            ["await each image", source.includes("await generate(imageOptions, infillData)")],
            ["fixed seeds increment", source.includes("baseSeed + index")],
            ["random seed per image", source.includes("randomSeed ? resolveGenerationSeed(-1) : baseSeed + index")],
            ["keep previous results", source.includes("appendGeneratedResult(blob, imageOptions, index, batchCount)")],
            ["batch settings export", source.includes("batchCount: fields.batch.value === \"\" ? null : Number(fields.batch.value)")],
            ["settings v2 compatibility", source.includes("settings.version !== 2 && settings.version !== GENERATION_SETTINGS_VERSION")]
          ];
          const failed = required.filter(([, passed]) => !passed).map(([name]) => name);
          if (failed.length) throw new Error("Batch regression checks failed: " + failed.join(", "));
          console.log("Sequential batch wiring passed: " + required.map(([name]) => name).join(", "));
          NODE
